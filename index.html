<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Todo App">
  <title>Todo App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, sans-serif;
      background: #1a1a2e;
      color: white;
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 28px;
      color: #e94560;
    }
    .input-area {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #16213e;
      color: white;
      font-size: 16px;
    }
    button {
      padding: 12px 20px;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }
    .task {
      display: flex;
      align-items: center;
      background: #16213e;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 10px;
      gap: 10px;
    }
    .task span {
      flex: 1;
      font-size: 16px;
    }
    .task.done span {
      text-decoration: line-through;
      opacity: 0.5;
    }
    .delete {
      background: #e94560;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 14px;
    }
    .check {
      background: #0f3460;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>p  <div class="input-area">
    <input type="text" id="taskInput" placeholder="Add a new task..." />
    <button onclick="addTask()">Add</button>
  </div>
  <div id="taskList"></div>

  <script>
    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

    function saveTasks() {
      localStorage.setItem("tasks", JSON.stringify(tasks));
    }

    function render() {
      const list = document.getElementById("taskList");
      list.innerHTML = "";
      tasks.forEach((task, i) => {
        list.innerHTML += `
          <div class="task ${task.done ? 'done' : ''}">
            <span>${task.text}</span>
            <button class="check" onclick="toggleTask(${i})">bction addTask() {
      const input = document.getElementById("taskInput");
      if (input.value.trim() === "") return;
      tasks.push({ text: input.value, done: false });
      input.value = "";
      saveTasks();
      render();
    }

    function toggleTask(i) {
      tasks[i].done = !tasks[i].done;
      saveTasks();
      render();
    }

    function deleteTask(i) {
      tasks.splice(i, 1);
      saveTasks();
      render();
    }

    render();
  </script>
</body>
</html>
